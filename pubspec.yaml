name: exam_prima
description: "ExamPrima - Halaman Syarat Ujian"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  appcheck: 1.8.1
  webview_flutter: ^4.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/examprima.png"
  adaptive_icon_background: "#0D47C9"
  adaptive_icon_foreground: "assets/icon/examprima.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/